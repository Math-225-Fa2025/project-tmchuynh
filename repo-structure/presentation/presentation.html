class: center, left

## Research Questions

**How do chess players perform and progress across different platforms and contexts?**

1. What are the rating differences between Lichess and FIDE systems?
2. How do players improve over time?
3. What factors influence game outcomes?

---

class: inverse, center, middle

# Part 1: Rating Systems Comparison

---

# Lichess vs. FIDE Ratings

.center[
&lt;img src="presentation_files/rating_comparison.png" width="75%" /&gt;
]

**Key Finding:** Lichess ratings are systematically higher than FIDE across most rating groups, indicating platform-specific rating inflation.

---

# Rating Gap Distribution

.pull-left[
&lt;img src="presentation_files/rating_gap_distribution.png" width="100%" /&gt;
]

.pull-right[
**Observations:**
- Positive gaps across all tiers
- Largest differences at extremes (Under-1600 and 2600+)
- Average gap: ~150-200 rating points
- Reflects different player pools and rating calculation methods
]

---

# Distribution Comparison

.center[
&lt;img src="presentation_files/rating_distribution_comparison.png" width="70%" /&gt;
]

Lichess attracts a broader range of online players, while FIDE focuses on over-the-board tournament participants.

---

class: inverse, center, middle

# Part 2: Performance Analysis

---

# Win Rate by Rating Tier

.pull-left[
&lt;img src="presentation_files/winrate_by_tier.png" width="100%" /&gt;
]

.pull-right[
**Key Insights:**
- Win rates remain stable around 50% across tiers
- Slight upward trend at higher ratings
- Elite players show greater consistency
- Lower variance in outcomes at top levels
]

---

# Game Outcomes by Color

.center[
&lt;img src="presentation_files/game_outcomes_by_color.png" width="65%" /&gt;
]

**White advantage confirmed:** Approximately 52-54% better outcomes when playing White, consistent with chess theory.

---

# Performance by Time Control

.center[
&lt;img src="presentation_files/game_outcomes_by_time_control.png" width="70%" /&gt;
]

Faster time controls (Bullet, Blitz) show more decisive results; Classical games have higher draw rates.

---

# Accuracy and Outcomes

.center[
&lt;img src="presentation_files/accuracy_distribution_by_outcome.png" width="65%" /&gt;
]

**Strong correlation:** Higher accuracy directly predicts winning outcomes, with clear separation between wins, draws, and losses.

---

class: inverse, center, middle

# Part 3: Opening Analysis

---

# Win Rate by Opening Family

.center[
&lt;img src="presentation_files/win_rate_by_opening_family.png" width="70%" /&gt;
]

Different opening systems show varying effectiveness, with some providing consistent advantages.

---

# Opening Performance by Color

.center[
&lt;img src="presentation_files/win_rate_by_opening_and_color.png" width="75%" /&gt;
]

Opening effectiveness varies significantly based on whether you're playing White or Black pieces.

---

# Color Advantage by Opening

.center[
&lt;img src="presentation_files/opening_color_advantage.png" width="70%" /&gt;
]

Some openings strongly favor White (positive values), while others provide better chances for Black (negative values).

---

# Opening Outcomes Distribution

.center[
&lt;img src="presentation_files/opening_outcomes_by_color.png" width="70%" /&gt;
]

Complete win/loss/draw breakdown shows how opening choice impacts game decisiveness.

---

class: inverse, center, middle

# Part 4: Longitudinal Analysis

---

# Rating Progression Over Time

.center[
&lt;img src="presentation_files/lichess-rating-progression-over-time.png" width="75%" /&gt;
]

Individual player trajectories show diverse learning patterns and skill development paths.

---

# Cumulative Rating Change

.center[
&lt;img src="presentation_files/cumulative_rating_change.png" width="70%" /&gt;
]

Net rating changes reveal which players improve, plateau, or decline over their playing history.

---

# Rating Volatility Analysis

.pull-left[
&lt;img src="presentation_files/rating_volatility.png" width="100%" /&gt;
]

.pull-right[
**Findings:**
- Higher volatility in faster time controls
- Individual variation in consistency
- Skill stabilization over time
- Lower variance indicates mastery
]

---

# Rolling Win Rate Trends

.center[
&lt;img src="presentation_files/rolling_win_rate_over_time.png" width="70%" /&gt;
]

20-game rolling averages smooth short-term fluctuations and reveal genuine performance trends.

---

class: inverse, center, middle

# Part 5: Growth Modeling

---

# Linear Growth Rates

.center[
&lt;img src="presentation_files/rating_growth.png" width="70%" /&gt;
]

Linear regression reveals weekly improvement rates, with R² indicating model fit quality for each player.

---

# Nonlinear Growth Models

.center[
&lt;img src="presentation_files/nonlinear_growth_models.png" width="75%" /&gt;
]

**Exponential saturation model:** `R = A - B × e^(-kt)`

Captures rapid initial improvement followed by plateauing near skill ceiling.

---

# Nonlinear Rating Progression

.center[
&lt;img src="presentation_files/nonlinear_rating_progression.png" width="70%" /&gt;
]

Model fits demonstrate characteristic S-curve learning patterns across multiple players.

---

class: inverse, center, middle

# Part 6: Advanced Analytics

---

# Activity-Performance Correlation

.center[
&lt;img src="presentation_files/activity-improvement-heatmap.png" width="65%" /&gt;
]

Heatmap reveals relationship between playing frequency and rating improvement across different activity levels.

---

# Correlation Matrix

.center[
&lt;img src="presentation_files/pairwise-correlations.png" width="65%" /&gt;
]

Pairwise correlations identify key relationships between rating, win rate, rating gap, and sample size.

---

# Rating Difference Impact

.center[
&lt;img src="presentation_files/rating_difference_distribution.png" width="70%" /&gt;
]

Distribution of rating differentials shows expected outcomes: positive differences predict wins, negative predict losses.

---

# Win Rate by Rating Category

.center[
&lt;img src="presentation_files/win_rate_by_rating_category.png" width="70%" /&gt;
]

Clear monotonic relationship: as rating advantage increases, win probability rises systematically.

---

class: inverse, center, middle

# Key Findings Summary

---

# Major Conclusions

.pull-left[
**Rating Systems:**
- Lichess inflates ratings by ~150-200 points
- Platform differences reflect player pools
- Rating gaps consistent across skill levels

**Performance Factors:**
- White advantage: 52-54% win rate
- Accuracy strongly predicts outcomes
- Time control affects decisiveness
]

.pull-right[
**Skill Development:**
- Exponential learning curves
- Initial rapid improvement
- Plateau near skill ceiling
- Individual variation in learning rates

**Strategic Insights:**
- Opening choice matters
- Color impacts opening effectiveness
- Activity correlates with improvement
]

---

# Statistical Methods Used

- **Descriptive Statistics:** Mean, median, SD across groups
- **Correlation Analysis:** Pearson and Spearman coefficients
- **Linear Regression:** Growth rate estimation
- **Nonlinear Regression:** Exponential saturation models
- **Time Series Analysis:** Rolling averages, trend decomposition
- **Categorical Analysis:** Chi-square tests, contingency tables
- **Data Visualization:** ggplot2, interactive plotly dashboards

---

# Limitations &amp; Future Work

**Limitations:**
- Platform-specific results (Lichess focus)
- Self-selection bias in sample
- Limited temporal scope
- Rating system differences

**Future Directions:**
- Cross-platform validation (Chess.com, FIDE data)
- Machine learning for outcome prediction
- Deeper opening theory analysis
- Psychological factors in performance
- Real-time rating adjustment models

---

class: center, middle

# Thank You!

**Questions?**

- Appendix A: Summary Statistics
- Appendix B: Longitudinal Analysis  
- Appendix C: Nonlinear Modeling
- Appendix D: Interactive Dashboard

]
